# Re-grade this block's gap-to-T1 state from the committed signoff manifest
# (T1 item 10, "CI keeps the harness and evidence formats valid").
#
# The block grades `tier: T1` and `klt signoff --manifest` exits 0 today; it
# exits 3 while any item is unmet, so a nonzero exit is not by itself a failed
# run. The gate is the byte diff against the committed report, not the exit
# code; exit 0 and 3 pass, everything else fails.
#
# klt is pinned to the one full klayout-tools commit the committed report was
# graded with, because the report embeds the grader build (build.git_commit,
# build.grading_ruleset_id) and a floating install would churn it. This is the
# single place the pin is recorded. Bump it deliberately, together with a
# regenerated manifests/sg13g2-fpga.signoff.json (see manifests/README.md).
# Pinned commit: 5dbbad05ff42265c92a6f3d2f20d1bbcd2957d49 (klayout-tools v0.9.0 release merge, CI green), a
# descendant of b31f0aa (klayout-tools#4250), so `klt signoff` item 11 reads the
# `power.tapless` field instead of grading a tapless library `no_pdn`
# (klayout-tools#4199). It keeps `klt synthesize --check --netlist --skip-deck`
# (the item-1 freshness check) and item-2 `--attest 2 --input STREAM`
# (klayout-tools#4188).

name: signoff

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  grade:
    runs-on: ubuntu-latest
    env:
      # The single place the pin is recorded (see the file header); the
      # install step and the tag-agreement check below both consume it.
      KLT_PIN: 5dbbad05ff42265c92a6f3d2f20d1bbcd2957d49
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Check the tag in flow/toolchain.json dereferences to the pin
        run: |
          REMOTE="https://github.com/2AMLogic/klayout-tools"
          REL="$(python3 -I -c 'import json; print(json.load(open("flow/toolchain.json"))["klayout-tools"].get("release", ""))')"
          if [ -z "$REL" ]; then
            echo "::error::flow/toolchain.json declares no klayout-tools.release tag to check against the pin"
            exit 1
          fi
          # Ask for the bare tag and its ^{} peel together and take the last
          # line: ^{} resolves annotated tags only (a lightweight tag yields
          # nothing), and refname ordering puts the peeled line last. An
          # absent tag answers empty at exit 0, so emptiness is a failure of
          # its own, not a match.
          set +e
          LSOUT="$(git ls-remote "$REMOTE" "refs/tags/$REL" "refs/tags/$REL^{}")"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::could not reach $REMOTE to resolve tag $REL (git ls-remote exit $rc)"
            exit 1
          fi
          RESOLVED="$(printf '%s\n' "$LSOUT" | tail -n1 | cut -f1)"
          if [ -z "$RESOLVED" ]; then
            echo "::error::tag $REL not found on $REMOTE"
            exit 1
          fi
          if [ "$RESOLVED" != "$KLT_PIN" ]; then
            echo "::error::tag $REL dereferences to $RESOLVED, not the installed pin $KLT_PIN"
            echo "::error::bump flow/toolchain.json's klayout-tools.release together with the signoff.yml pin (manifests/README.md, Rules)"
            exit 1
          fi
          echo "tag $REL resolves to $RESOLVED, equal to the installed pin"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the pinned klt (klayout-tools)
        run: |
          uv tool install "klayout-tools @ git+https://github.com/2AMLogic/klayout-tools@${KLT_PIN}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Re-run klt signoff and diff against the committed report
        run: |
          set +e
          klt signoff --manifest manifests/sg13g2-fpga.json --format json > "$RUNNER_TEMP/fresh.json"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "::error::klt signoff failed (exit $rc)"
            cat "$RUNNER_TEMP/fresh.json"
            exit 1
          fi
          if ! diff -u manifests/sg13g2-fpga.signoff.json "$RUNNER_TEMP/fresh.json"; then
            echo "::error::fresh klt signoff grade differs from manifests/sg13g2-fpga.signoff.json"
            echo "Regenerate it as described in manifests/README.md"
            exit 1
          fi
          echo "signoff report reproduced (klt exit $rc)"

      - name: Re-attest T1 item 10 and diff against the committed envelope
        run: |
          klt signoff --attest 10 --inventory manifests/inventories/item-10.json \
            --check manifests/item-10.attestation.json

      - name: Re-attest T1 item 9 and diff against the committed envelope
        run: |
          klt signoff --attest 9 --inventory manifests/inventories/item-9.json \
            --check manifests/item-9.attestation.json

      - name: Re-attest T1 item 2 and diff against the committed envelope
        run: |
          klt signoff --attest 2 --input layout/records/20261030-09fa1bd/logic_tile_routed.gds \
            --check manifests/item-2.attestation.json

      - name: Re-attest T1 item 1 (RTL to synthesized netlist freshness)
        run: |
          klt signoff --attest 1 --inventory manifests/inventories/item-1.json \
            --check manifests/item-1.attestation.json
