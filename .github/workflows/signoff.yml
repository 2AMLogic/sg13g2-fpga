# Re-grade this block's gap-to-T1 state from the committed signoff manifest
# (T1 item 10, "CI keeps the harness and evidence formats valid").
#
# `klt signoff --manifest` exits 3 when the block is not yet T1 (some item is
# unmet): that is a successful, expected run today. The gate is the byte diff
# against the committed report, not the exit code; exit 0 and 3 pass,
# everything else fails.
#
# klt is pinned to the one full klayout-tools commit the committed report was
# graded with, because the report embeds the grader build (build.git_commit,
# build.grading_ruleset_id) and a floating install would churn it. This is the
# single place the pin is recorded. Bump it deliberately, together with a
# regenerated manifests/sg13g2-fpga.signoff.json (see manifests/README.md).
# Pinned commit: 7755612adb513f00ec61e7a77ff7091aee7630f5, "feat(signoff): item
# 6 not_applicable outcome"; the same grader sky130-fpga is pinned to.

name: signoff

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the pinned klt (klayout-tools)
        run: |
          uv tool install "klayout-tools @ git+https://github.com/2AMLogic/klayout-tools@7755612adb513f00ec61e7a77ff7091aee7630f5"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Re-run klt signoff and diff against the committed report
        run: |
          set +e
          klt signoff --manifest manifests/sg13g2-fpga.json --format json > "$RUNNER_TEMP/fresh.json"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "::error::klt signoff failed (exit $rc)"
            cat "$RUNNER_TEMP/fresh.json"
            exit 1
          fi
          if ! diff -u manifests/sg13g2-fpga.signoff.json "$RUNNER_TEMP/fresh.json"; then
            echo "::error::fresh klt signoff grade differs from manifests/sg13g2-fpga.signoff.json"
            echo "Regenerate it as described in manifests/README.md"
            exit 1
          fi
          echo "signoff report reproduced (klt exit $rc)"
